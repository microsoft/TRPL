# Custom BoT-SORT tracker config for room monitoring
# Optimized for: close-range, single room, people walking in/out of frame

tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.3
new_track_thresh: 0.5       # Match conf_threshold to avoid ghost tracks
track_buffer: 300            # Keep lost tracks alive ~10 seconds at 30fps
match_thresh: 0.8
fuse_score: True

# GMC
gmc_method: sparseOptFlow

# BoT-SORT ReID (disabled — we use our own cross-camera ReID)
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
