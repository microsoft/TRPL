<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Camera LLM Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #topbar {
            padding: 12px 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #topbar h1 { font-size: 1.1em; color: #58a6ff; }
        #status {
            margin-left: auto;
            font-size: 0.85em;
            padding: 4px 12px;
            border-radius: 12px;
            background: #1c1c1c;
        }
        #status.connecting { color: #d29922; background: #2d2200; }
        #status.connected { color: #3fb950; background: #0d2818; }
        #status.waiting { color: #8b949e; background: #1c1c1c; }
        #status.error { color: #f85149; background: #2d0a0a; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.event {
            align-self: flex-end;
            background: #1c3a5f;
            color: #a2d2ff;
            font-size: 0.85em;
            font-family: monospace;
        }
        .msg.response {
            align-self: flex-start;
            background: #1a3328;
            color: #a8e6cf;
            font-size: 1.05em;
        }
        .msg.system {
            align-self: center;
            background: #21262d;
            color: #8b949e;
            font-size: 0.8em;
            text-align: center;
        }
        .msg .label {
            font-size: 0.75em;
            opacity: 0.6;
            margin-bottom: 4px;
        }
        .msg .time {
            font-size: 0.7em;
            opacity: 0.4;
            margin-top: 4px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="topbar">
        <h1>Camera LLM Monitor</h1>
        <span id="status" class="waiting">waiting for session...</span>
    </div>
    <div id="messages">
        <div class="msg system">waiting for camera events...</div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const statusEl = document.getElementById('status');
        let ws = null;
        let pollTimer = null;
        let sessionId = null;

        function addMsg(type, label, text) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            const now = new Date().toLocaleTimeString();
            div.innerHTML = `<div class="label">${label}</div>${text}<div class="time">${now}</div>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function setStatus(cls, text) {
            statusEl.className = cls;
            statusEl.textContent = text;
        }

        async function pollForSession() {
            try {
                const resp = await fetch('/api/camera/session');
                const data = await resp.json();
                if (data.session_id) {
                    sessionId = data.session_id;
                    clearInterval(pollTimer);
                    addMsg('system', '', `session found: ${sessionId}`);
                    connectWebSocket(sessionId);
                }
            } catch (e) {
                // ignore, keep polling
            }
        }

        function connectWebSocket(sid) {
            setStatus('connecting', 'connecting...');
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/api/debate/ws/${sid}`);

            ws.onopen = () => {
                setStatus('connected', `connected (${sid.substring(0, 8)}...)`);
                addMsg('system', '', 'WebSocket connected');
            };

            ws.onmessage = (evt) => {
                try {
                    const msg = JSON.parse(evt.data);
                    handleMessage(msg);
                } catch (e) {
                    // binary or unparseable
                }
            };

            ws.onclose = () => {
                setStatus('waiting', 'disconnected, retrying...');
                addMsg('system', '', 'WebSocket disconnected, retrying...');
                setTimeout(() => {
                    pollTimer = setInterval(pollForSession, 1500);
                }, 2000);
            };

            ws.onerror = () => {
                setStatus('error', 'connection error');
            };
        }

        function handleMessage(msg) {
            const type = msg.type;

            if (type === 'debate_output') {
                // LLM response
                const text = msg.text || '';
                if (text && !msg.streaming) {
                    addMsg('response', 'LLM Response', text);
                } else if (text && msg.stream_end) {
                    addMsg('response', 'LLM Response', text);
                }
            } else if (type === 'debug_message') {
                const agent = msg.agent || '';
                const content = msg.content || '';
                if (agent === 'CameraService') {
                    addMsg('event', `Camera Event`, content);
                } else {
                    addMsg('system', agent, content);
                }
            }
        }

        // Start polling immediately
        setStatus('waiting', 'waiting for session...');
        pollTimer = setInterval(pollForSession, 1500);
        // Also try immediately
        pollForSession();
    </script>
</body>
</html>
