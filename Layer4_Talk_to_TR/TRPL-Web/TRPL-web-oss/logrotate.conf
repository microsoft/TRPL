# Replace /path/to/deployment with the actual absolute path used on the
# deployment host (e.g. the checkout root for this repo on that machine).
/path/to/deployment/lia_agent_api/logs/*.log
/path/to/deployment/livekit_worker/logs/*.log
{
    hourly
    rotate 5
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d-%H%M%S
}
